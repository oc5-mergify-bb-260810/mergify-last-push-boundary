merge_protections_settings:
  reporting_method: check-runs

merge_protections:
  - name: BB most recent push protection
    if:
      - base = main
    success_conditions:
      - base = main

pull_request_rules:
  - name: BB trusted branch update
    conditions:
      - title = BB last push update canary
      - "#commits-behind > 0"
    actions:
      update:

  - name: BB merge only after protection success
    conditions:
      - title = BB last push merge canary
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge

  - name: BB fresh last-push same-cycle dismiss 20260813
    conditions:
      - title = BB_FRESH_LAST_PUSH_TOC_20260813_D1
      - "#approved-reviews-by >= 1"
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: always

  - name: BB fresh last-push same-cycle merge 20260813
    conditions:
      - title = BB_FRESH_LAST_PUSH_TOC_20260813_D1
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge
