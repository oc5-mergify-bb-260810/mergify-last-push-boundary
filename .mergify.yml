merge_protections_settings:
  reporting_method: check-runs

merge_protections:
  - name: BB most recent push protection
    if:
      - base = main
    success_conditions:
      - base = main

pull_request_rules:
  - name: BB rebase-only freshness control 20260814
    conditions:
      - title = BB rebase-only freshness control 20260814
      - "#commits-behind > 0"
      - "#approved-reviews-by >= 1"
    actions:
      rebase:

  - name: BB rebase stale-auth phase 20260814
    conditions:
      - title = BB rebase stale-auth attack 20260814
      - "#commits-behind > 0"
      - "#approved-reviews-by >= 1"
    actions:
      rebase:

  - name: BB merge stale-auth phase 20260814
    conditions:
      - title = BB rebase stale-auth attack 20260814
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge

  - name: BB config setup and cleanup
    conditions:
      - title = BB last push merge canary
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge
