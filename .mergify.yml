merge_protections_settings:
  reporting_method: check-runs

merge_protections:
  - name: BB most recent push protection
    if:
      - base = main
    success_conditions:
      - base = main

pull_request_rules:
  - name: BB strict dismiss phase1
    conditions:
      - title = BB strict dismiss phase1 20260811
      - "#approved-reviews-by >= 1"
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: always

  - name: BB strict fresh merge after dismiss
    conditions:
      - title = BB strict fresh merge after dismiss 20260811
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge

  - name: BB strict same-cycle dismiss
    conditions:
      - title = BB strict same-cycle dismiss merge 20260811
      - "#approved-reviews-by >= 1"
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: always

  - name: BB strict same-cycle merge
    conditions:
      - title = BB strict same-cycle dismiss merge 20260811
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge
