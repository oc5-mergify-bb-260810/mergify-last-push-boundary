merge_protections_settings:
  reporting_method: check-runs

merge_protections:
  - name: BB most recent push protection
    if:
      - base = main
    success_conditions:
      - base = main

pull_request_rules:
  - name: BB dismiss stale approvals on synchronize 20260812
    conditions:
      - base = main
      - "#approved-reviews-by >= 1"
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize

  - name: BB merge unapproved C discriminator 20260812
    conditions:
      - title = BB dismiss unapproved C discriminator 20260812
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge
