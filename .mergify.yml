merge_protections_settings:
  reporting_method: check-runs

merge_protections:
  - name: BB most recent push protection
    if:
      - base = main
    success_conditions:
      - base = main

pull_request_rules:
  - name: BB trusted branch update
    conditions:
      - title = BB last push update canary
      - "#commits-behind > 0"
    actions:
      update:

  - name: BB merge only after protection success
    conditions:
      - title = BB last push merge canary
      - check-success = Mergify Merge Protections
    actions:
      merge:
        method: merge


  - name: BB secret team normal request
    conditions:
      - title = BB secret team normal request 20260811
    actions:
      request_reviews:
        teams:
          - h1lab-secret-review-20260811

  - name: BB secret team member expansion
    conditions:
      - title = BB secret team member expansion 20260811
    actions:
      request_reviews:
        users_from_teams:
          - h1lab-secret-review-20260811
